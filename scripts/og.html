<!DOCTYPE html>
<!-- Source for pfl/og.png. Rendered at 1200x630 by scripts/og.mjs.
     Edit this, then re-run `node scripts/og.mjs`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Mint Grotesk';
    src: url('../pfl/fonts/MintGroteskV0.6-Regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Mint Grotesk';
    src: url('../pfl/fonts/MintGroteskV0.6-Bold.woff2') format('woff2');
    font-weight: 700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #fff;
    font-family: 'Mint Grotesk', sans-serif;
    color: #2c2c2c;
    position: relative;
    padding: 56px 72px 40px;
    overflow: hidden;
  }

  .top {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 56px;
    align-items: center;
    height: 450px;
  }

  h1 { font-size: 56px; line-height: 68px; font-weight: 400; letter-spacing: -0.015em; }
  h1 b { font-weight: 700; }

  .sub { margin-top: 28px; font-size: 24px; line-height: 34px; color: #7c7c7c; }

  .art { display: grid; grid-template-columns: repeat(2, 176px); gap: 16px; }
  .art img { width: 176px; height: 176px; object-fit: contain; }

  .foot {
    /* Anchored from the top on purpose. With `bottom` and a viewport whose
       height exactly equals the body height, headless Chrome drops this row
       from the capture. `top` renders reliably at any viewport height. */
    position: absolute;
    left: 72px;
    right: 72px;
    top: 534px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #e4e4e4;
    padding-top: 24px;
    font-size: 22px;
    line-height: 30px;
  }
  .foot .url { font-weight: 700; }
  .foot .by { color: #7c7c7c; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>Hand-drawn line<br>illustrations.<br><b>Free as PNG.</b></h1>
      <p class="sub">SVG, Figma and full resolution — $15</p>
    </div>
    <div class="art">
      <img src="../pfl/images/png/illustrator-at-laptop-line-illustration-500.png" alt="">
      <img src="../pfl/images/png/potted-flower-line-illustration-500.png" alt="">
      <img src="../pfl/images/png/site-map-line-illustration-500.png" alt="">
      <img src="../pfl/images/png/meditation-line-illustration-500.png" alt="">
    </div>
  </div>
  <div class="foot">
    <span class="url">payforlayers.com</span>
    <span class="by">Carlos Peixoto</span>
  </div>
</body>
</html>
